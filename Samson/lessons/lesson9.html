<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 9: Coming Soon - Tigrinya Mastery</title>
    <meta name="description" content="Lesson 9 is on the way — new Tigrinya content coming soon.">
    <link rel="icon" type="png" href="/images/bm1.png">
    <style>
        :root {
            --bg-cream: #fdf3d8;
            --pale-green: #eaf1eb;
            --golden-yellow: #fceea7;
            --muted-green: #8aa38c;
            --charcoal: #2b2c30;
            --bright-yellow: #fadc19;
            --vibrant-tillian: #00ffff;
            --white: #ffffff;
            --accent-red: #d30000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--charcoal);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .logo-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-frame {
            display: inline-flex;
            text-decoration: none;
            background: linear-gradient(135deg, var(--vibrant-tillian), var(--golden-yellow), var(--accent-red), var(--vibrant-tillian));
            background-size: 300% 300%;
            animation: flowGradient 6s ease infinite;
            padding: 4px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(211, 0, 0, 0.15);
        }

        .logo-inner {
            display: flex;
            align-items: center;
            background-color: var(--bg-cream);
            border-radius: 12px;
        }

        .logo-img {
            height: 50px;
            width: auto;
            object-fit: contain;
            padding: 4px 8px 4px 12px;
            display: block;
        }

        .logo-text {
            color: var(--charcoal);
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
            padding-right: 15px;
        }

        .coming-soon-wrap {
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }

        .emoji-icon {
            font-size: 4rem;
            animation: float 3s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .coming-soon-wrap h1 {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--charcoal);
            margin-bottom: 8px;
        }

        .coming-soon-wrap .tag {
            display: inline-block;
            background: var(--vibrant-tillian);
            color: var(--charcoal);
            font-weight: 900;
            padding: 5px 15px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid var(--charcoal);
            font-size: 0.8rem;
            margin-bottom: 18px;
        }

        .coming-soon-wrap p {
            font-size: 1.05rem;
            color: var(--muted-green);
            font-weight: 600;
            margin-bottom: 25px;
        }

        .back-link {
            display: inline-block;
            text-decoration: none;
            font-weight: 800;
            padding: 10px 22px;
            border-radius: 25px;
            color: var(--charcoal);
            background: var(--white);
            border: 2px solid #d5d0c5;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .back-link:hover {
            background: var(--charcoal);
            color: var(--vibrant-tillian);
            border-color: var(--charcoal);
        }

        @media (max-width: 500px) {
            .coming-soon-wrap h1 {
                font-size: 1.8rem;
            }
            .emoji-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <div class="coming-soon-wrap">
        <div class="logo-header">
            <a href="/page/index.html" class="logo-frame">
                <div class="logo-inner">
                    <img src="/images/bm1.png" alt="BM Insights Logo" class="logo-img">
                    <span class="logo-text">BM-INSIGHTS</span>
                </div>
            </a>
        </div>

        <div class="emoji-icon">📝</div>

        <span class="tag">Lesson 9</span>
        <h1>Coming Soon</h1>
        <p>New content is being prepared. Check back shortly!</p>

        <a href="/page/index.html" class="back-link">← Back to Lessons</a>
    </div>

</body>
</html>
